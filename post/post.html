<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicaciones & Artículos — Adrián Gómez-Lobo</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Estilos separados -->
  <link rel="stylesheet" href="post.css">
</head>

<body>

  <!-- BARRA SUPERIOR -->
  <header>
    <div class="header-left">
      <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Volver al Juego</a>
      <span class="doc-title">Publicaciones & Devlogs</span>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="layout">

    <!-- ÍNDICE DINÁMICO DE POSTS -->
    <aside>
      <h3>Publicaciones</h3>
      <ul id="posts-list">
        <!-- Renderizado dinámicamente desde JS -->
      </ul>
    </aside>

    <!-- ÁREA DE LECTURA DEL ARTICLE -->
    <main>
      <div class="post-container">
        
        <div class="post-header">
          <div id="post-tags" class="post-tags"></div>
          <h1 id="post-title" class="post-title">Cargando publicación...</h1>
          <div id="post-meta" class="post-meta"></div>
        </div>

        <div id="post-content" class="post-content">
          <!-- Contenido inyectado por JS -->
        </div>

      </div>
    </main>

  </div>

  <!-- Carga de Base de Datos y Lógica del Blog -->
  <script src="post_data.js"></script>
  <script src="post.js"></script>
</body>

</html>
